services:
  - type: web
    name: rag-gpt-api
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rag-gpt-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: rag-gpt-db
    plan: free
    databaseName: raggpt
    user: raggpt
